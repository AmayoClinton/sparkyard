version: "2.4"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sparkyard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sparkyard"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sparkyard?sslmode=disable
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_LOCAL_RELAY: ws://localhost:8081
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata: