services:
  - type: web
    name: sparkyard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_LOCAL_RELAY
        value: wss://sparkyard-relay.onrender.com

  - type: web
    name: sparkyard-relay
    runtime: docker
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sparkyard-db
          property: connectionString

databases:
  - name: sparkyard-db
    plan: free
    databaseName: sparkyard